name: Build dowolne repo

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "URL repozytorium do skompilowania (np. https://github.com/owner/repo)"
        required: true
      branch:
        description: "Gałąź/tag (puste = domyślna)"
        required: false
        default: ""
      gradle_task:
        description: "Zadanie Gradle (domyślnie assembleDebug)"
        required: false
        default: "assembleDebug"
      app_name:
        description: "Nazwa aplikacji do etykiety (puste = z nazwy repo)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o clt.zip
          unzip -q clt.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Klonuj cel
        id: clone
        run: |
          URL="${{ github.event.inputs.repo_url }}"
          BR="${{ github.event.inputs.branch }}"
          NAME="${{ github.event.inputs.app_name }}"
          [ -z "$NAME" ] && NAME="$(basename "$URL" .git)"
          echo "app_name=$NAME" >> "$GITHUB_OUTPUT"
          git clone --depth 1 ${BR:+--branch "$BR"} "$URL" any
          echo "commit=$(git -C any rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
          LAST=$(python3 -c "import json;print(json.dumps(json.load(open('docs/data/status.json')).get('lastBuild',{})))")
          cat > docs/data/status.json <<EOF
          {
            "state": "building",
            "step": "Kompiluję $NAME — klonuję i buduję",
            "started": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "lastBuild": $LAST
          }
          EOF
          git config user.name "pi-agent[bot]"
          git config user.email "pi-agent[bot]@users.noreply.github.com"
          git add docs/data/status.json
          git commit -m "build: start $NAME" || true
          git push origin HEAD:main

      - name: Kompiluj (gradlew)
        run: |
          cd any
          if [ ! -x gradlew ] && [ -f gradlew ]; then chmod +x gradlew; fi
          if [ ! -x ./gradlew ]; then
            echo "Brak gradlew — repo nie ma Gradle wrappera."
            exit 1
          fi
          ./gradlew "${{ github.event.inputs.gradle_task }}" --no-daemon --stacktrace

      - name: Zbierz APK
        id: apks
        run: |
          NAME="${{ steps.clone.outputs.app_name }}"
          C7="$(git -C any rev-parse --short HEAD)"
          mkdir -p docs/dist
          find any -path "*/outputs/apk/*" -name "*.apk" -print0 |
          while IFS= read -r -d '' f; do
            bn="$(basename "$f")"
            cp "$f" "docs/dist/${NAME}-${C7}-${bn}"
          done
          if ! ls docs/dist/${NAME}-${C7}-*.apk >/dev/null 2>&1; then
            find any -name "*.apk" -not -path "*/.git/*" -print0 |
            while IFS= read -r -d '' f; do
              bn="$(basename "$f")"
              cp "$f" "docs/dist/${NAME}-${C7}-${bn}"
            done
          fi
          ls -la docs/dist/${NAME}-${C7}-*.apk
          find docs/dist -maxdepth 1 -name "${NAME}-${C7}-*.apk" -printf "%f\n" | sort > apks.txt
          cat apks.txt

      - name: Publikuj APK + status
        run: |
          NAME="${{ steps.clone.outputs.app_name }}"
          C="$(git -C any rev-parse HEAD)"
          URL="${{ github.event.inputs.repo_url }}"
          python3 build/publish_any.py "$URL" "$C" "$NAME" $(cat apks.txt)
          git config user.name "pi-agent[bot]"
          git config user.email "pi-agent[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "build: publish $NAME @ $(echo $C | cut -c1-7)" || true
          git push origin HEAD:main

      - name: Błąd buildu — status
        if: failure()
        run: |
          NAME="${{ steps.clone.outputs.app_name || 'repo' }}"
          LAST=$(python3 -c "import json;print(json.dumps(json.load(open('docs/data/status.json')).get('lastBuild',{})))" 2>/dev/null || echo '{}')
          cat > docs/data/status.json <<EOF
          {
            "state": "error",
            "step": "Błąd kompilacji $NAME — zobacz logi w Actions",
            "started": null,
            "updated": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "lastBuild": $LAST
          }
          EOF
          git config user.name "pi-agent[bot]"
          git config user.email "pi-agent[bot]@users.noreply.github.com"
          git add docs/data/status.json
          git commit -m "build: error $NAME" || true
          git push origin HEAD:main || true
